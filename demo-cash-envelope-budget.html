<style>

  --text:#eef0ff; --muted:#9aa0c6; --faint:#6b7199;

}
[data-theme="light"]{

  --shadow:0 8px 24px rgba(60,40,20,.08);
}
/* extra named themes, available in every app (html[...] wins over an edition's own colours) */

html[data-theme="sunset"]{--bg:#fff5ee;--bg2:#fbe9df;--surface:#ffffff;--surface2:#fff3ec;--line:#f3d9cc;--text:#2c1712;--muted:#80594d;--faint:#b3918a;--accent:#e2553a;--accent-soft:rgba(226,85,58,.12);--mint:#2a9d78;--mint-soft:rgba(42,157,120,.12);--lav:#c2477f;--lav-soft:rgba(194,71,127,.1);--gold:#d08a17;--danger:#c93a4f}
html[data-theme="forest"]{--bg:#f2f6ef;--bg2:#e7efe2;--surface:#ffffff;--surface2:#f1f6ee;--line:#d6e3cf;--text:#18261a;--muted:#5b6f5c;--faint:#93a493;--accent:#4f8a3a;--accent-soft:rgba(79,138,58,.12);--mint:#2f8f66;--mint-soft:rgba(47,143,102,.12);--lav:#6c7fd1;--lav-soft:rgba(108,127,209,.1);--gold:#b98a17;--danger:#c7454f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,var(--lav-soft),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--accent-soft),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:6px}

.nav:hover{background:var(--surface);color:var(--text)}
.nav.on{background:var(--surface2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side .spacer{flex:1}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}

.grid>*{min-width:0}

.card h3{flex-wrap:wrap;gap:6px}

.g2{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}

.row{display:flex;align-items:center;gap:12px}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(90deg,var(--lav-soft),var(--accent-soft));border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.chart{width:100%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}

.cd .bl.gone i{background:var(--faint)}

.hq{width:20px;height:20px;border-radius:50%;border:1px solid var(--lav);background:var(--lav-soft);color:var(--lav);font-size:11px;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-left:6px;line-height:1}

.toast.act{pointer-events:auto}

.dots{display:flex;gap:6px;margin-bottom:18px}

.wz h2{font-size:26px;margin-top:6px}
.wz-emoji{font-size:34px}
.wb{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}

.tap{cursor:pointer;transition:.15s}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- debt engine ---------- */
function simulate(debts, extra, method, rollover = true) {
  let ds = debts.filter(d => d.balance > 0 && d.min > 0).map(d => ({ ...d, bal: +d.balance, paidMonth: null }));
  if (!ds.length) return { months: 0, interest: 0, series: [0], order: [], never: false };
  const order = [...ds].sort((a, b) => method === 'avalanche' ? (b.apr - a.apr) || (a.bal - b.bal) : (a.bal - b.bal) || (b.apr - a.apr));
  const budget = ds.reduce((s, d) => s + d.min, 0) + (rollover ? extra : 0);
  let m = 0, interest = 0; const series = [ds.reduce((s, d) => s + d.bal, 0)];
  while (m < 600 && ds.some(d => d.bal > 0.005)) {
    m++;
    for (const d of ds) if (d.bal > 0) { const i = Math.round(d.bal * d.apr / 1200 * 100) / 100; d.bal += i; interest += i; }
    let pool = budget;
    for (const d of ds) if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; }
    if (rollover) for (const o of order) { const d = ds.find(x => x.id === o.id); if (d.bal > 0 && pool > 0) { const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    for (const d of ds) if (d.bal <= 0.005 && !d.paidMonth) { d.bal = 0; d.paidMonth = m; }
    series.push(ds.reduce((s, d) => s + d.bal, 0));
  }
  const never = ds.some(d => d.bal > 0.005);
  return { months: never ? Infinity : m, interest, series, never, order: order.map(o => ds.find(x => x.id === o.id)) };
}

function vDebt() {
  const d = state.debts, plan = simulate(d, +state.debtExtra || 0, state.debtMethod), mins = simulate(d, 0, state.debtMethod, false);

  const when = m => isFinite(m) ? fmtD(addMonths(start, m - 1, 1), { month: 'long', year: 'numeric' }) : 'never';
  const savedI = mins.never ? null : Math.max(0, mins.interest - plan.interest), savedM = mins.never ? null : Math.max(0, mins.months - plan.months);

    <div class="card"><h3>You'll save</h3><div class="big acc">${savedI == null ? (d.length ? 'Everything' : '—') : esc(money(savedI, 0))}</div><div class="small muted">${savedI == null ? (d.length ? 'Minimums alone would never finish.' : '') : `and ${savedM} months vs paying only minimums`}</div></div>
    <div class="card"><h3>Total owed</h3><div class="big">${esc(money(total, 0))}</div><div class="small muted">${d.length} debts · ${esc(money(plan.never ? 0 : plan.interest, 0))} interest on this plan</div></div>

    <div class="small muted" style="margin-bottom:10px">${d.length && !other.never && !plan.never ? (other.interest < plan.interest - 1 ? `Tip: ${state.debtMethod === 'snowball' ? 'Avalanche' : 'Snowball'} would save another ${esc(money(plan.interest - other.interest, 0))} in interest.` : `This is the cheapest order for you. Nice.`) : ''}</div>
    ${d.length ? lines([plan.series, mins.never ? mins.series.slice(0, Math.max(plan.series.length * 2, 24)) : mins.series], ['var(--accent)', 'var(--faint)']) : ''}
    ${d.length ? `<div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Your plan</span><span><i style="background:var(--faint)"></i>Minimums only</span></div>` : ''}
  </div>
  <div class="card" style="margin-top:18px"><h3>Payoff order</h3><div class="list">
    ${plan.order.map((x, i) => `<div class="item"><div class="ico" style="font-weight:700">${i + 1}</div><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${esc(money(x.balance))} at ${(+x.apr).toFixed(2)}% · min ${esc(money(x.min))}${x.start > x.balance ? ` · <span class="pos">${esc(money(x.start - x.balance, 0))} paid off so far</span>` : ''}</div>

// what really happened in a month: pay that landed, every bill that fell, spending logged, no-spend days
function monthStats(base) {
  const start = new Date(base.getFullYear(), base.getMonth(), 1), end = new Date(base.getFullYear(), base.getMonth() + 1, 1), key = monthKey(start);
  const upto = end > d0() ? addDays(d0(), 1) : end; // only count days that have happened
  const cameIn = incomes().reduce((s, i) => s + payDates(i, start, end).length * net(i), 0)
    + (state.moneyIn || []).filter(x => x.date.startsWith(key)).reduce((s, x) => s + x.amount, 0);
  const bills = state.bills.reduce((s, b) => s + occurrences(b, start, end).length * b.amount, 0);
  const sp = state.spends.filter(x => x.date.startsWith(key)), spent = sp.reduce((s, x) => s + x.amount, 0);
  const byCat = {}; sp.forEach(x => byCat[x.cat] = (byCat[x.cat] || 0) + x.amount);
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
  const days = Math.max(0, daysBetween(start, upto)), spendDays = new Set(sp.map(x => x.date)).size;
  const ticked = (state.paidLog || []).filter(x => x.date.startsWith(key)).length;
  return { key, start, cameIn, bills, spent, kept: cameIn - bills - spent, byCat, top, days, noSpend: Math.max(0, days - spendDays), ticked, logged: sp.length };
}
function netWorth() {
  const sf = safe();
  const cash = sf.balance - sf.since + sf.got + sf.savings.reduce((s, a) => s + a.balance, 0);
  const saved = multi() ? 0 : state.goals.reduce((s, g) => s + (+g.saved || 0), 0); // with accounts, savings already live in a savings account
  const owed = state.debts.reduce((s, d) => s + (+d.balance || 0), 0) + cardAccts().reduce((s, a) => s + a.balance + cardCharges(a), 0);
  return { cash, saved, owed, net: cash + saved - owed };
}

const filled = v => String(v).trim() !== '', positive = v => num(v) > 0;

function act(a, el = {}) {  const ds = el.dataset || {}, id = ds.id;
  const find = (arr) => state[arr].find(x => x.id === id);
  switch (a) {
    case 'theme': state.settings.theme = ['light', 'forest', 'sunset'].includes(state.settings.theme) ? 'dark' : 'light'; save(); render(); break;
    case 'focus': document.body.classList.toggle('focus'); toast(document.body.classList.contains('focus') ? 'Focus mode: just the essentials' : 'Everything is back'); break;
    case 'explain': { const x = $('#explain'); x.hidden = !x.hidden; break; }
    case 'paid': { const b = find('bills'); lastDeleted = { paid: true, id: b.id, prev: b.paidThrough }; b.paidThrough = ds.d; (state.paidLog ||= []).push({ id: b.id, account: acctOf(b), date: ds.d, amount: b.amount, ts: Date.now() }); state.paidLog = state.paidLog.slice(-300); state.demo = state.demo; save(); render(); toast(`${b.name} marked paid ✓`, true); break; }
    case 'pickCat': { const q = $('#qa'); const n = (q.value.match(/[\d.]+/) || [''])[0]; q.value = `${n} ${ds.c}`.trim(); q.focus(); break; }
    case 'quickAdd': { if (demoBlocked()) { demoWall(); return; }
      const v = $('#qa').value.trim(); const m = v.match(/([\d]+(?:\.\d+)?)/); if (!m) { need([['#qa', () => false]], 'Type an amount first, like "12 coffee"'); return; }
      const rest = v.replace(m[0], '').trim(); const cats = Object.keys(state.budgets);
      const w = rest.toLowerCase().split(' ')[0];
      const cat = cats.find(c => w && c.toLowerCase().startsWith(w)) || cats.find(c => (WORD_CAT[c] || []).some(k => w.startsWith(k))) || 'Other';
      state.spends.push({ id: uid(), ts: Date.now(), date: iso(d0()), amount: +m[1], cat, note: rest && cat.toLowerCase() !== rest.toLowerCase() ? rest : '' });
      commit(`Logged ${money(+m[1])} · ${cat}`); break; }
    case 'amt': $('#sAmt').value = ds.v; break;
    case 'addSpend': { if (demoBlocked()) { demoWall(); return; } if (!need([['#sAmt', positive]], 'Type how much you spent')) return; const amt = num($('#sAmt').value); state.spends.push({ id: uid(), ts: Date.now(), date: $('#sDate').value || iso(d0()), amount: amt, cat: $('#sCat').value, note: $('#sNote').value.trim(), account: $('#sAcct')?.value || undefined }); commit('Spend added'); break; }
    case 'delSpend': removeItem('spends', id, 'Spend'); break;
    case 'editSpend': { const x = find('spends'); modal(`<h2>Edit spend</h2><div class="form" style="grid-template-columns:1fr 1fr"><label class="f">Amount<input id="eA" value="${x.amount}"></label><label class="f">Date<input id="eD" type="date" value="${x.date}"></label><label class="f">Category<select id="eC">${Object.keys(state.budgets).map(c => `<option ${c === x.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label><label class="f">Note<input id="eN" value="${esc(x.note)}"></label>${acctSelect('eAcct', x.account, 'Paid from')}</div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveSpend" data-id="${x.id}">Save</button></div>`); break; }
    case 'saveSpend': { const x = find('spends'); Object.assign(x, { amount: num($('#eA').value), date: $('#eD').value, cat: $('#eC').value, note: $('#eN').value, account: $('#eAcct')?.value || x.account }); closeModal(); commit('Saved'); break; }
    case 'newBill': modal(billForm()); break;
    case 'editBill': modal(billForm(find('bills'))); break;
    case 'saveBill': {
      if (!need([['#bName', filled], ['#bAmt', positive]], 'Add the bill name and amount (the grey text is only an example)')) return; const name = $('#bName').value.trim(), amount = num($('#bAmt').value);
      const data = { name, amount, freq: $('#bFreq').value, cat: $('#bCat').value, day1: num($('#bD1').value) || 1, day2: num($('#bD2').value) || 15, anchor: $('#bAnchor').value, every: num($('#bEvery').value) || 6, smooth: $('#bSmooth').checked, account: $('#bAcct')?.value || undefined };
      if (id) { const b = find('bills'), changed = ['freq', 'day1', 'day2', 'anchor', 'every'].some(k => b[k] !== data[k]); Object.assign(b, data); if (changed) { b.paidThrough = null; settlePast(b); } } else state.bills.push(settlePast({ id: uid(), paidThrough: null, ...data }));
      closeModal(); commit('Bill saved'); break; }
    case 'delBill': removeItem('bills', id, 'Bill'); break;
    case 'newDebt': modal(debtForm()); break;
    case 'editDebt': modal(debtForm(find('debts'))); break;
    case 'saveDebt': { if (!need([['#xName', filled], ['#xBal', positive], ['#xMin', positive]], 'Add the name, balance and minimum payment')) return; const data = { name: $('#xName').value.trim() || 'Debt', balance: num($('#xBal').value), apr: num($('#xApr').value), min: num($('#xMin').value) }; if (id) { const x = find('debts'); Object.assign(x, data); x.start = Math.max(x.start || 0, data.balance); } else state.debts.push({ id: uid(), start: data.balance, payments: [], ...data }); closeModal(); commit('Debt saved'); break; }
    case 'delDebt': removeItem('debts', id, 'Debt'); break;
    case 'method': state.debtMethod = ds.v; commit(); break;
    case 'newGoal': modal(goalForm()); break;
    case 'editGoal': modal(goalForm(find('goals'))); break;
    case 'saveGoal': { if (!need([['#gName', filled], ['#gT', positive]], 'Give your goal a name and a target')) return; const data = { name: $('#gName').value.trim() || 'Goal', emoji: $('#gEmoji').value || '🎯', target: num($('#gT').value), saved: num($('#gS').value), monthly: num($('#gM').value), by: $('#gBy').value || '', reserve: $('#gRes').checked }; if (id) Object.assign(find('goals'), data); else state.goals.push({ id: uid(), ...data }); closeModal(); commit('Goal saved'); break; }
    case 'delGoal': removeItem('goals', id, 'Goal'); break;
    case 'addToGoal': { const g = find('goals'); modal(`<h2>Add to ${esc(g.name)}</h2><label class="f">Amount<input id="agA" class="bigin" inputmode="decimal" autofocus></label><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-act="close">Cancel</button><button class="btn mint" data-act="doAddGoal" data-id="${g.id}">Add</button></div>`); break; }
    case 'doAddGoal': { if (!need([['#agA', positive]], 'Type how much you are adding')) return; const g = find('goals'); g.saved += num($('#agA').value); closeModal(); commit(g.saved >= g.target ? `🎉 ${g.name} reached!` : 'Nice. Added.'); break; }
    case 'mPrev': monthOffset--; render(); break;
    case 'mNext': monthOffset++; render(); break;
    case 'delCat': {
      const c = ds.c, n = state.spends.filter(x => x.cat === c).length;
      const go = () => { delete state.budgets[c]; state.spends.forEach(x => { if (x.cat === c) x.cat = 'Other'; }); if (!('Other' in state.budgets)) state.budgets.Other = 0; commit(`Category "${c}" deleted`); };
      if (n) askConfirm(`Delete "${c}"?`, `Its ${n} spend${n > 1 ? 's' : ''} will move to Other, so your totals stay right.`, 'Delete category', go, true); else go();
      break; }
    case 'addCat': { const c = $('#newCat').value.trim(); if (!c) { toast('Type a name for the new category first'); $('#newCat').focus(); break; } if (c in state.budgets) { toast('You already have that category'); break; } state.budgets[c] = 0; commit('Category added'); break; }
    case 'backup': download(`${slug()}-backup-${iso(d0())}.json`, JSON.stringify(state, null, 1), 'application/json'); toast('Backup downloaded'); break;
    case 'csv': download(`${slug()}-spending-${iso(d0())}.csv`, 'date,amount,category,note\n' + state.spends.map(x => [x.date, x.amount, x.cat, `"${(x.note || '').replace(/"/g, '""')}"`].join(',')).join('\n'), 'text/csv'); break;
    case 'startFresh': askConfirm(state.demo ? 'Start your own plan?' : 'Start fresh?', state.demo ? 'The example numbers will be cleared and a quick setup will walk you through your own.' : 'This clears everything in this planner. Download a backup first if you might want it back.', state.demo ? 'Start setup' : 'Clear everything', () => { state = blank(); save(); view = 'today'; render(); wizard(0); }, !state.demo); break;
    case 'loadDemo': askConfirm('Show example numbers?', 'Everything you have typed will be replaced by the demo. Download a backup first if you want to keep it.', 'Show examples', () => { const th = state.settings.theme; state = demo(); state.settings.theme = th; save(); view = 'today'; render(); }, true); break;
    case 'confirmOk': { const fn = pendingConfirm; pendingConfirm = null; closeModal(); fn && fn(); break; }
    case 'undo': if (lastDeleted?.paid) { const b = state.bills.find(x => x.id === lastDeleted.id); if (b) b.paidThrough = lastDeleted.prev; state.paidLog.pop(); lastDeleted = null; save(); render(); toast('Back to unpaid'); } else if (lastDeleted) { state[lastDeleted.arr].splice(lastDeleted.i, 0, lastDeleted.item); lastDeleted = null; save(); render(); toast('Restored'); } break;
    case 'setup': wizard(0); break;
    case 'wizNext': wizSave(); wizard(wiz + 1); break;
    case 'wizSkip': wizard(wiz + 1); break;
    case 'wizBack': wizSave(); wizard(wiz - 1); break;
    case 'wizFreq': wizSave(); state.settings.payFreq = ds.v; save(); wizard(2); break;
    case 'wizPick': { wizSave(); const ex = state.bills.find(b => b.name === ds.n); if (ex) state.bills = state.bills.filter(b => b !== ex); else state.bills.push({ id: uid(), name: ds.n, amount: 0, freq: 'monthly', day1: 1, cat: ds.c, paidThrough: null, _new: true }); save(); wizard(3); const inp = document.querySelector(`[data-wb="${(state.bills.at(-1) || {}).id}"][data-k="amount"]`); if (!ex && inp) inp.focus(); break; }
    case 'wizCustom': { wizSave(); state.bills.push({ id: uid(), name: '', amount: 0, freq: 'monthly', day1: 1, cat: 'Other', paidThrough: null }); wizard(3); const n = document.querySelectorAll('[data-k="name"]'); n[n.length - 1]?.focus(); break; }
    case 'wizDelBill': wizSave(); state.bills = state.bills.filter(b => b.id !== id); save(); wizard(3); break;
    case 'wizDone': wizSave(); state.demo = false; state.bills = state.bills.filter(b => b.name && b.amount > 0).map(({ _new, ...b }) => settlePast(b)); save(); closeModal(); view = 'today'; render(); toast('All set. Welcome to your ' + ED.name + ' ✨'); break;
    case 'editBalance': modal(`<h2>Update your balance${multi() ? 's' : ''}</h2><p class="muted small">Copy ${multi() ? 'each one' : 'it'} from your banking app. Anything you log from now on comes off automatically.</p>${multi() ? balanceInputs(true) : `<label class="f" style="margin-top:12px">Balance right now<input id="ubB" class="bigin" inputmode="decimal" value="${state.settings.balance}" autofocus></label>`}<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveBalance">Save balance</button></div>`); setTimeout(() => $('#ubB')?.select(), 60); break;
    case 'saveBalance': { if (multi()) { document.querySelectorAll('[data-ub]').forEach(el => { const a = state.accounts.find(x => x.id === el.dataset.ub); if (a && String(el.value).trim() !== '' && num(el.value) !== a.balance) { a.balance = num(el.value); a.balanceDate = iso(d0()); a.balanceTs = Date.now(); } }); } else { const s = state.settings; s.balance = num($('#ubB').value); s.balanceDate = iso(d0()); s.balanceTs = Date.now(); } closeModal(); commit('Balance updated'); break; }
    case 'wbSave': {
      document.querySelectorAll('[data-wbk]').forEach(c => { if (!c.checked) return; const b = state.bills.find(x => x.id === c.dataset.id); if (b && (!b.paidThrough || c.dataset.d > b.paidThrough)) b.paidThrough = c.dataset.d; });
      if (multi()) { document.querySelectorAll('[data-ub]').forEach(el => { const a = state.accounts.find(x => x.id === el.dataset.ub); if (a && String(el.value).trim() !== '') { a.balance = num(el.value); a.balanceDate = iso(d0()); a.balanceTs = Date.now(); } }); } else { const v = $('#wbBal').value; if (String(v).trim() !== '') { const s = state.settings; s.balance = num(v); s.balanceDate = iso(d0()); s.balanceTs = Date.now(); } }
      closeModal(); commit('All caught up ✨'); break; }
    case 'addDump': { const v = $('#bd').value.trim(); if (!v) { need([['#bd', () => false]], 'Type the thought first'); return; } (state.dump ||= []).push({ id: uid(), text: v, ts: Date.now() }); save(); render(); setTimeout(() => $('#bd')?.focus(), 30); toast('Out of your head ✓'); break; }
    case 'delDump': removeItem('dump', id, 'Note'); break;
    case 'simple': state.settings.simple = !state.settings.simple; if (state.settings.simple && ['debt', 'goals', 'month'].includes(view)) view = 'today'; save(); render(); toast(state.settings.simple ? 'Simple view: just the everyday screens' : 'Everything is back'); break;
    case 'acctsOn': { const s = state.settings; state.accounts = [{ id: 'main', name: 'Main account', type: 'spending', balance: +s.balance || 0, balanceDate: s.balanceDate || iso(d0()), balanceTs: s.balanceTs || 0 }]; save(); render(); modal(acctForm()); toast('Your current balance is now "Main account". Add the others.'); break; }
    case 'acctsOff': askConfirm('Go back to one account?', 'Your spending accounts are added together into one balance. Savings accounts are dropped from the planner. Bills and spends stay as they are.', 'Use one account', () => {
      const s = state.settings, sp = spendAccts();
      s.balance = sp.reduce((t, a) => t + a.balance - spentSince(a), 0); s.balanceDate = iso(d0()); s.balanceTs = Date.now();
      state.accounts = []; commit('Back to one account'); }); break;
    case 'newAcct': modal(acctForm()); break;
    case 'editAcct': modal(acctForm(state.accounts.find(x => x.id === id))); break;
    case 'saveAcct': {
      if (!need([['#aName', filled], ['#aBal', v => String(v).trim() !== '']], 'Give the account a name and its balance')) return;
      const data = { name: $('#aName').value.trim(), type: $('#aType').value, balance: num($('#aBal').value) };
      if (id) { const a = state.accounts.find(x => x.id === id); if (a.balance !== data.balance) { a.balanceDate = iso(d0()); a.balanceTs = Date.now(); } Object.assign(a, data); }
      else state.accounts.push({ id: uid(), balanceDate: iso(d0()), balanceTs: Date.now(), ...data });
      if (!spendAccts().length) { state.accounts[0].type = 'spending'; toast('At least one account has to be for spending'); }
      closeModal(); commit('Account saved'); break; }
    case 'delAcct': {
      const used = state.bills.filter(b => b.account === id).length + state.spends.filter(x => x.account === id).length;
      askConfirm(`Delete ${acctName(id)}?`, used ? `${used} bills or spends use it. Bills move to your first spending account; past spends stay in your reports.` : 'Nothing uses this account.', 'Delete account', () => {
        state.accounts = state.accounts.filter(a => a.id !== id);
        if (!spendAccts().length && state.accounts[0]) state.accounts[0].type = 'spending';
        // bills and incomes move to the default account; past spends stay in reports but no longer come off any balance
        [...state.bills, ...(state.extraIncomes || [])].forEach(x => { if (x.account === id) delete x.account; });
        [...state.spends, ...(state.paidLog || [])].forEach(x => { if (x.account === id) { delete x.account; x.fromDeleted = true; } });
        if (state.settings.payAccount === id) delete state.settings.payAccount;
        commit('Account deleted'); }, true); break; }
    case 'hq': modal(`<h2>What is this?</h2><p class="muted" style="line-height:1.7">${esc(HELP[ds.k] || '')}</p><div class="row" style="justify-content:space-between;margin-top:14px"><button class="how" data-act="helpToggle">Turn help tips off</button><button class="btn" data-act="close">Got it</button></div>`); break;
    case 'helpToggle': state.settings.help = state.settings.help === false; closeModal(); save(); render(); toast(state.settings.help === false ? 'Help tips hidden. Turn them back on from Today.' : 'Help tips are on: tap any ? to learn what it does'); break;
    case 'qaPlus': { const q = $('#qa'), m = q.value.match(/^\s*([\d.]+)(.*)$/), cur = m ? +m[1] : 0, rest = m ? m[2] : (q.value ? ' ' + q.value.trim() : ''); q.value = `${Math.round((cur + +ds.v) * 100) / 100}${rest}`; q.focus(); break; }
    case 'focusQa': $('#qa')?.focus(); $('#qa')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    case 'newIncome': modal(incomeForm()); break;
    case 'editIncome': modal(incomeForm((state.extraIncomes || []).find(x => x.id === id))); break;
    case 'saveIncome': {
      if (!need([['#iName', filled], ['#iAmt', positive]], 'Give the income a name and an amount')) return;
      const data = { name: $('#iName').value.trim(), amount: num($('#iAmt').value), freq: $('#iFreq').value, anchor: $('#iAnchor').value, day1: num($('#iD1').value) || 1, day2: num($('#iD2').value) || 15, split: num($('#iSplit').value), early: $('#iEarly').checked, account: $('#iAcct')?.value || undefined };
      state.extraIncomes ||= [];
      if (id) Object.assign(state.extraIncomes.find(x => x.id === id), data); else state.extraIncomes.push({ id: uid(), ...data });
      closeModal(); commit('Income saved'); break; }
    case 'delIncome': state.extraIncomes ||= []; removeItem('extraIncomes', id, 'Income'); break;
    case 'payDebt': modal(paymentForm(find('debts'))); break;
    case 'savePayment': {
      if (!need([['#pA', positive]], 'Type how much you paid')) return;
      const x = find('debts'), amt = num($('#pA').value);
      x.start ||= +x.balance; (x.payments ||= []).push({ date: $('#pD').value || iso(d0()), amount: amt });
      x.balance = Math.max(0, Math.round((+x.balance - amt) * 100) / 100);
      closeModal(); commit(x.balance <= 0 ? `🎉 ${x.name} is paid off!` : `${money(amt)} paid · ${money(x.balance)} left`); break; }
    case 'calDay': calSel = calSel === ds.d ? null : ds.d; render(); if (calSel) setTimeout(() => document.querySelector('main > .card:last-child')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50); break;
    case 'calPrev': calOffset--; calSel = null; render(); break;
    case 'calNext': calOffset++; calSel = null; render(); break;
    case 'calToday': calOffset = 0; calSel = iso(d0()); render(); break;
    case 'preset': { if (demoBlocked()) { demoWall(); return; } const p = presets()[+ds.v]; state.spends.push({ id: uid(), ts: Date.now(), date: iso(d0()), amount: p.amount, cat: p.cat in state.budgets ? p.cat : 'Other', note: p.label }); commit(`Logged  · `); break; }
    case 'savePresets': { const rows = [...document.querySelectorAll('[data-pr]')].map(r => ({ label: r.querySelector('.prL').value.trim(), amount: num(r.querySelector('.prA').value), cat: r.querySelector('.prC').value })).filter(p => p.label && p.amount > 0); state.presets = rows; commit('Quick buttons saved'); break; }
    case 'newChal': modal(chalForm()); showChalFields(); break;
    case 'saveChal': {
      const type = $('#cType').value;
      if (type === 'custom' && !need([['#cT', positive], ['#cN', positive]], 'Give a target and how many boxes')) return;
      (state.challenges ||= []).push({ id: uid(), type, name: $('#cName').value.trim() || CHAL_TYPES[type].name, start: $('#cStart').value || iso(d0()), n: type === 'week52' ? 52 : Math.min(365, Math.max(5, num($('#cN').value) || 100)), target: num($('#cT')?.value), goal: $('#cGoal')?.value || '', done: [] });
      closeModal(); commit('Challenge started. Tap a box each time you save.'); break; }
    case 'chalBox': {
      const c = (state.challenges || []).find(x => x.id === id), k = +ds.v, amt = boxAmount(c, k), g = c.goal && state.goals.find(x => x.id === c.goal);
      c.done ||= [];
      if (c.done.includes(k)) { c.done = c.done.filter(x => x !== k); if (g) g.saved = Math.max(0, g.saved - amt); save(); render(); toast(`Box ${k} emptied`); }
      else { c.done.push(k); if (g) g.saved += amt; save(); render(); const st = chalStats(c); toast(st.pct >= 1 ? '🎉 Challenge complete!' : `+${money(amt)} saved · ${money(st.saved, 0)} so far`); }
      break; }
    case 'delChal': askConfirm('Remove this challenge?', 'Boxes you filled stay in any linked goal. This only removes the challenge.', 'Remove', () => removeItem('challenges', id, 'Challenge'), true); break;
    case 'addIncome': {
      if (!need([['#iiAmt', positive]], 'Type how much came in')) return;
      (state.moneyIn ||= []).push({ id: uid(), ts: Date.now(), date: $('#iiDate').value || iso(d0()), amount: num($('#iiAmt').value), source: $('#iiSrc').value.trim(), account: $('#iiAcct')?.value || undefined, tax: $('#iiTax').checked });
      const r = taxRate(), a = num($('#iiAmt').value); commit(r && $('#iiTax').checked ? `Logged ${money(a)} · ${money(a * r / 100)} kept aside for tax` : `Logged ${money(a)}`); break; }
    case 'delIncomeLog': removeItem('moneyIn', id, 'Income'); break;
    case 'newEnv': modal(envForm()); break;
    case 'editEnv': modal(envForm(ds.c)); break;
    case 'saveEnv': {
      if (!need([['#eName', filled], ['#eCap', v => String(v).trim() !== '']], 'Give the envelope a name and a monthly cap')) return;
      const nm = $('#eName').value.trim(), cap = num($('#eCap').value), old = ds.c;
      if (old && old !== nm) { delete state.budgets[old]; state.spends.forEach(x => { if (x.cat === old) x.cat = nm; }); }
      state.budgets[nm] = cap; closeModal(); commit('Envelope saved'); break; }
    case 'range': rangeMonths = +ds.v; render(); break;
    case 'wrapShow': modal(wrappedHtml(new Date(d0().getFullYear(), d0().getMonth() + monthOffset, 1))); break;
    case 'wrapLast': modal(wrappedHtml(new Date(d0().getFullYear(), d0().getMonth() - 1, 1))); break;
    case 'wrapDone': state.wrappedSeen = monthKey(new Date(d0().getFullYear(), d0().getMonth() - 1, 1)); closeModal(); save(); render(); break;
    case 'print': window.print(); break;
    case 'csvRange': {
      const base = new Date(d0().getFullYear(), d0().getMonth() + monthOffset, 1), keys = [...Array(rangeMonths)].map((_, i) => monthKey(new Date(base.getFullYear(), base.getMonth() - i, 1)));
      const rows = state.spends.filter(x => keys.some(k => x.date.startsWith(k))).sort((a, b) => a.date.localeCompare(b.date));
      download(`${slug()}-${keys[keys.length - 1]}-to-${keys[0]}.csv`, 'date,amount,category,note\n' + rows.map(x => [x.date, x.amount, x.cat, `"${(x.note || '').replace(/"/g, '""')}"`].join(',')).join('\n'), 'text/csv'); toast(`Exported ${rows.length} spends`); break; }
    case 'calAddSpend': view = 'spend'; render(); setTimeout(() => { $('#sDate').value = ds.d; $('#sAmt').focus(); }, 30); break;
    case 'more': modal(`<h2>More</h2><div class="list">${shownMore().map(([k, t]) => `<button class="nav" data-go="${k}" style="font-size:16px">${I[k]}<span>${t}</span></button>`).join('')}</div>`); break;
    case 'close': closeModal(); break;
  }
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { view = go.dataset.go; document.body.classList.remove('focus'); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]'); if (a) { e.preventDefault(); act(a.dataset.act, a); return; }
  if (e.target.id === 'modal' && !$('#modal').dataset.wizard) closeModal();
});
document.addEventListener('change', e => { if (e.target.id === 'bFreq') showFields(); if (e.target.id === 'iFreq') showIncomeFields(); if (e.target.id === 'cType') showChalFields(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').dataset.wizard) closeModal(); if (e.key === 'Enter' && $('#modal').classList.contains('on') && e.target.tagName === 'INPUT') { const b = $('#modalCard .btn:not(.ghost):not(.danger)'); if (b && !e.target.classList.contains('wb')) { e.preventDefault(); b.click(); } } });
